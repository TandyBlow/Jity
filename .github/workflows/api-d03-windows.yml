name: API and D03 source handoff
on:
  push:
    branches: [codex/api-small-model-windows-20261110]
  workflow_dispatch:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU model dependencies
        run: python -m pip install -r experiments/d03-macbert/requirements.txt
      - name: Audit tracked source
        run: python -X utf8 scripts/hybrid/check_release.py
      - name: D03 data and portable CPU tests
        run: python -X utf8 -m unittest discover -s experiments/d03-macbert -p "test_*.py" -v
      - name: API orchestration tests without network calls
        run: python -X utf8 -m unittest discover -s scripts/hybrid -p "test_*.py" -v
